<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>핼로훈 | 자기소개</title>
  <meta name="description" content="코드와 커피, 책과 산책을 좋아하는 핼로훈의 자기소개 페이지" />

  <!-- Pretendard (Google Fonts에 없어 공식 jsDelivr CDN 사용) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
  />

  <style>
    :root {
      --bg-start: #F8FAFC;
      --bg-end: #E0F2FE;
      --accent: #0EA5E9;
      --accent-dark: #0284C7;
      --text: #1E293B;
      --text-muted: #64748B;
      --card-bg: rgba(255, 255, 255, 0.65);
      --card-border: rgba(255, 255, 255, 0.8);
      --line: rgba(14, 165, 233, 0.18);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
        system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
    }

    /* 은은한 배경 글로우 */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 420px;
      height: 420px;
      top: -120px;
      left: -100px;
      background: rgba(14, 165, 233, 0.18);
    }
    body::after {
      width: 360px;
      height: 360px;
      bottom: -120px;
      right: -80px;
      background: rgba(125, 211, 252, 0.28);
    }

    /* ---------- Card ---------- */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 48px 36px 40px;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      box-shadow:
        0 1px 2px rgba(15, 23, 42, 0.04),
        0 12px 32px -8px rgba(14, 165, 233, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow:
        0 2px 4px rgba(15, 23, 42, 0.04),
        0 24px 48px -12px rgba(14, 165, 233, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    /* ---------- Avatar ---------- */
    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
      background: linear-gradient(135deg, #38BDF8 0%, var(--accent) 50%, var(--accent-dark) 100%);
      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.9),
        0 0 0 5px var(--line),
        0 10px 24px -6px rgba(14, 165, 233, 0.5);
      user-select: none;
    }

    /* ---------- Text ---------- */
    .name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .bio {
      margin-top: 10px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      word-break: keep-all;
    }

    .divider {
      width: 40px;
      height: 1px;
      margin: 28px auto;
      border: 0;
      background: var(--line);
    }

    /* ---------- Tags ---------- */
    .tags {
      list-style: none; /* 리스트 마커 제거 */
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .tags li {
      list-style: none;
    }

    .tags li::marker {
      content: "";
    }

    .tag {
      display: inline-block;
      padding: 7px 16px;
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1;
      color: var(--accent-dark);
      background: rgba(14, 165, 233, 0.08);
      border: 1px solid rgba(14, 165, 233, 0.2);
      border-radius: 999px;
      cursor: default;
      transition: background-color 0.2s ease, color 0.2s ease,
        border-color 0.2s ease, transform 0.2s ease;
    }

    .tag:hover {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* ---------- Social ---------- */
    .social {
      margin-top: 32px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      background: var(--text);
      border-radius: 12px;
      box-shadow: 0 4px 12px -4px rgba(30, 41, 59, 0.4);
      transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .btn:hover {
      background: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -6px rgba(14, 165, 233, 0.55);
    }

    .btn:focus-visible,
    .tag:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 40px 24px 32px;
        border-radius: 20px;
      }

      .avatar {
        width: 80px;
        height: 80px;
        font-size: 30px;
        margin-bottom: 20px;
      }

      .name {
        font-size: 24px;
      }

      .bio {
        font-size: 14px;
      }

      .divider {
        margin: 24px auto;
      }

      .tag {
        font-size: 13px;
        padding: 6px 14px;
      }

      .social {
        margin-top: 28px;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">H</div>

    <h1 class="name">핼로훈</h1>
    <p class="bio">동일미래과학고등학교 AI융합콘텐츠과 교사입니다.</p>

    <hr class="divider" />

    <ul class="tags" aria-label="관심사">
      <li><span class="tag">독서</span></li>
      <li><span class="tag">여행</span></li>
      <li><span class="tag">사진</span></li>
      <li><span class="tag">커피</span></li>
    </ul>

    <nav class="social" aria-label="소셜 링크">
      <a
        class="btn"
        href="https://github.com/hellohun-lab/1st_homepage"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .5C5.65.5.5 5.65.5 12.02c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56 0-.27-.01-1-.02-1.96-3.2.7-3.87-1.54-3.87-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.17 1.18a10.98 10.98 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14 0 1.55-.01 2.79-.01 3.17 0 .31.21.67.8.56A11.53 11.53 0 0 0 23.5 12.02C23.5 5.65 18.35.5 12 .5Z"/>
        </svg>
        GitHub
      </a>
    </nav>
  </main>
</body>
</html>
